<svg xmlns="http://www.w3.org/2000/svg" width="760" height="238" viewBox="0 0 760 238" role="img" aria-labelledby="t d">
<title id="t">EXP-004: drift contrasts vs RAND (confirmatory)</title>
<desc id="d">Forest plot of paired seed-level drift differences (radians) versus RAND. Dots: mean over 10 seeds. Thick bars: 95 % percentile bootstrap CI. Thin bars: Holm-level bootstrap CI. Shaded band: SESOI plus or minus 0.05 rad. Dashed line: zero.</desc>
<rect width="760" height="238" fill="#ffffff"/>
<text x="12" y="22" font-family="serif" font-size="15" fill="#222">EXP-004: drift contrasts vs RAND (confirmatory)</text>
<text x="12" y="42" font-family="sans-serif" font-size="11" fill="#444">Seed-paired differences, n = 10 seeds; simulation only</text>
<rect x="297.0" y="58" width="180.6" height="110" fill="#eeeeee"/>
<line x1="387.3" y1="58" x2="387.3" y2="168" stroke="#555" stroke-dasharray="4 3"/>
<line x1="230.0" y1="168" x2="230.0" y2="172" stroke="#444"/>
<text x="230.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">-0.087</text>
<line x1="330.0" y1="168" x2="330.0" y2="172" stroke="#444"/>
<text x="330.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">-0.032</text>
<line x1="430.0" y1="168" x2="430.0" y2="172" stroke="#444"/>
<text x="430.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0.024</text>
<line x1="530.0" y1="168" x2="530.0" y2="172" stroke="#444"/>
<text x="530.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0.079</text>
<line x1="630.0" y1="168" x2="630.0" y2="172" stroke="#444"/>
<text x="630.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0.134</text>
<line x1="730.0" y1="168" x2="730.0" y2="172" stroke="#444"/>
<text x="730.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0.190</text>
<text x="222" y="81.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">SIM-RAND</text>
<line x1="666.7" y1="77.0" x2="703.2" y2="77.0" stroke="#7a7a7a" stroke-width="1"/>
