<circle cx="685.6" cy="77.0" r="4.5" fill="#b5523b"/>
<text x="222" y="107.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">POP-RAND</text>
<line x1="256.8" y1="103.0" x2="388.2" y2="103.0" stroke="#7a7a7a" stroke-width="1"/>
<line x1="256.8" y1="103.0" x2="388.2" y2="103.0" stroke="#1f4e79" stroke-width="4"/>
<circle cx="322.8" cy="103.0" r="4.5" fill="#b5523b"/>
<text x="222" y="133.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">MMR-RAND</text>
<line x1="475.8" y1="129.0" x2="506.5" y2="129.0" stroke="#7a7a7a" stroke-width="1"/>
