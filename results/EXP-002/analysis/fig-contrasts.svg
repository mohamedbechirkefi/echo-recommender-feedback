<line x1="648.8" y1="103.0" x2="699.9" y2="103.0" stroke="#1f4e79" stroke-width="4"/>
<circle cx="674.9" cy="103.0" r="4.5" fill="#b5523b"/>
<text x="222" y="133.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">MMR-RAND</text>
