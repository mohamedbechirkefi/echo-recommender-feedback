<svg xmlns="http://www.w3.org/2000/svg" width="760" height="238" viewBox="0 0 760 238" role="img" aria-labelledby="t d">
<title id="t">EXP-002: drift contrasts vs RAND (confirmatory)</title>
<desc id="d">Forest plot of paired seed-level drift differences (radians) versus RAND. Dots: mean over 10 seeds. Thick bars: 95 % percentile bootstrap CI. Thin bars: Holm-level bootstrap CI. Shaded band: SESOI plus or minus 0.05 rad. Dashed line: zero.</desc>
<rect width="760" height="238" fill="#ffffff"/>
<text x="12" y="22" font-family="serif" font-size="15" fill="#222">EXP-002: drift contrasts vs RAND (confirmatory)</text>
<text x="12" y="42" font-family="sans-serif" font-size="11" fill="#444">Seed-paired differences, n = 10 seeds; simulation only</text>
<rect x="378.7" y="58" width="139.0" height="110" fill="#eeeeee"/>
<line x1="448.2" y1="58" x2="448.2" y2="168" stroke="#555" stroke-dasharray="4 3"/>
<line x1="230.0" y1="168" x2="230.0" y2="172" stroke="#444"/>
<text x="230.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">-0.157</text>
<line x1="330.0" y1="168" x2="330.0" y2="172" stroke="#444"/>
<text x="330.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">-0.085</text>
<line x1="430.0" y1="168" x2="430.0" y2="172" stroke="#444"/>
<text x="430.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">-0.013</text>
<line x1="530.0" y1="168" x2="530.0" y2="172" stroke="#444"/>
<text x="530.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0.059</text>
<line x1="630.0" y1="168" x2="630.0" y2="172" stroke="#444"/>
<text x="630.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0.131</text>
<line x1="730.0" y1="168" x2="730.0" y2="172" stroke="#444"/>
<text x="730.0" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0.203</text>
<text x="222" y="81.0" text-anchor="end" font-family="sans-serif" font-size="11" fill="#222">SIM-RAND</text>
